<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Aydan Admin | Neon Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #070512; color: white; font-family: 'Inter', sans-serif; padding: 40px 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; }
        .card { background: rgba(255,255,255,0.03); padding: 35px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); }
        h2 { font-weight: 900; letter-spacing: 2px; text-align: center; margin: 0 0 30px; }
        input, select, button { width: 100%; padding: 16px; margin: 10px 0; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: white; box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 1rem; }
        input[type="file"] { padding: 12px; }
        button { background: linear-gradient(45deg, #7d5fff, #ff00de); border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; box-shadow: 0 10px 20px rgba(255,0,222,0.3); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        label { font-size: 0.75rem; color: #9a93c4; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .hidden { display: none; }
        .msg { text-align: center; font-size: 0.85rem; min-height: 1.2em; margin: 8px 0 0; }
        .msg.err { color: #ff4d4d; }
        .msg.ok { color: #4dffa6; }
        #preview { width: 100%; aspect-ratio: 1 / 1; max-height: 320px; border-radius: 12px; background: rgba(0,0,0,0.4) center / cover no-repeat; margin: 10px 0; display: none; }
        .manage { margin-top: 24px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 0 16px; }
        .manage > summary { list-style: none; cursor: pointer; padding: 16px 0; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        .manage > summary::-webkit-details-marker { display: none; }
        .manage > summary::after { content: '▾'; color: #7d5fff; font-size: 1.1rem; transition: transform 0.2s; }
        .manage[open] > summary::after { transform: rotate(180deg); }
        .manage[open] > summary { border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 12px; }
        .manage .count { margin-left: auto; margin-right: 12px; background: rgba(125,95,255,0.25); color: #cfc4ff; border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; }
        .group { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; margin-bottom: 12px; padding: 0 16px; }
        .group summary { list-style: none; cursor: pointer; padding: 16px 0; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        .group summary::-webkit-details-marker { display: none; }
        .group summary::after { content: '▾'; color: #7d5fff; font-size: 1.1rem; transition: transform 0.2s; }
        .group[open] summary::after { transform: rotate(180deg); }
        .group .count { margin-left: auto; margin-right: 12px; background: rgba(125,95,255,0.25); color: #cfc4ff; border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; }
        .group[open] summary { border-bottom: 1px solid rgba(255,255,255,0.08); }
        #list { padding: 6px 0 12px; }
        #list .group { background: rgba(255,255,255,0.02); margin: 10px 0 0; }
        .item-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .item-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .thumb { width: 44px; height: 44px; border-radius: 8px; background: rgba(255,255,255,0.08) center / cover no-repeat; flex-shrink: 0; }
        .item-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-delete { width: auto; margin: 0; background: none; color: #ff4d4d; border: 1px solid #ff4d4d; box-shadow: none; font-size: 0.7rem; padding: 6px 12px; flex-shrink: 0; }
        .btn-ghost { background: none; box-shadow: none; border: 1px solid rgba(255,255,255,0.2); font-size: 0.75rem; padding: 10px; }
        .links { text-align: center; margin-top: 16px; }
        .links a { color: grey; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">

        <!-- LOGIN -->
        <div class="card" id="login-view">
            <h2>ADMIN LOGIN</h2>
            <input type="email" id="email" placeholder="Email" autocomplete="username">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <button id="login-btn">Log in</button>
            <p class="msg" id="login-msg"></p>
            <p class="links"><a href="index.html">← Back to Site</a></p>
        </div>

        <!-- UPLOAD -->
        <div id="admin-view" class="hidden">
            <div class="card">
                <h2>UPLOAD</h2>

                <label for="title">Title</label>
                <input type="text" id="title" placeholder="Title (e.g. GTA VI)" maxlength="120">

                <label for="photo">Photo</label>
                <input type="file" id="photo" accept="image/jpeg,image/png,image/webp,image/gif">
                <div id="preview"></div>

                <label for="image_url">Or paste an image link (optional)</label>
                <input type="url" id="image_url" placeholder="https://... (used only if no photo is picked)">

                <label for="category">Section</label>
                <select id="category">
                    <option value="GAMES">GAMES</option>
                    <option value="APPS">APPS</option>
                    <option value="LINK">LINKS</option>
                    <option value="FILES">FILES</option>
                    <option value="HOME">HOME</option>
                </select>

                <label for="url">Link (where the photo takes people)</label>
                <input type="url" id="url" placeholder="https://...">

                <button id="save-btn">Push to Hub</button>
                <p class="msg" id="save-msg"></p>

                <button class="btn-ghost" id="logout-btn">Log out</button>
                <p class="links"><a href="index.html">← Back to Site</a></p>
            </div>

            <details class="manage" id="manage">
                <summary>Manage uploads <span class="count" id="total-count">0</span></summary>
                <div id="list"></div>
            </details>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tvasdkfdizdwkroatgno.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UQ0g7DJ4_Um1nrAEd6z4nA_LnMUIcSA';
        const BUCKET = 'photos';
        const MAX_BYTES = 15 * 1024 * 1024; // 15 MB in; photos are shrunk before upload
        const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const $ = id => document.getElementById(id);

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function webUrl(u) {
            try {
                const x = new URL(u);
                return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href.replace(/'/g, '%27') : null;
            } catch (e) { return null; }
        }

        function say(id, text, kind) {
            const el = $(id);
            el.textContent = text || '';
            el.className = 'msg' + (kind ? ' ' + kind : '');
        }

        // ---------- Login / session ----------
        function showView(loggedIn) {
            $('login-view').classList.toggle('hidden', loggedIn);
            $('admin-view').classList.toggle('hidden', !loggedIn);
            if (loggedIn) loadList();
        }

        async function login() {
            const email = $('email').value.trim();
            const password = $('password').value;
            if (!email || !password) return say('login-msg', 'Enter email and password', 'err');
            $('login-btn').disabled = true;
            say('login-msg', 'Logging in...');
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            $('login-btn').disabled = false;
            if (error) return say('login-msg', 'Login failed: ' + error.message, 'err');
            $('password').value = '';
            say('login-msg', '');
            showView(true);
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            showView(false);
        }

        // ---------- List ----------
        async function loadList() {
            const { data, error } = await supabaseClient.from('files').select('*').order('created_at', { ascending: false });
            if (error) { $('list').innerHTML = '<p class="msg err">Could not load items: ' + esc(error.message) + '</p>'; return; }
            const items = data || [];
            $('total-count').textContent = items.length;
            if (!items.length) { $('list').innerHTML = '<p class="msg">Nothing uploaded yet.</p>'; return; }

            // remember which drop-downs are open so they stay open after a delete or upload
            const wasOpen = new Set([...document.querySelectorAll('#list details[open]')].map(d => d.dataset.cat));

            const SECTIONS = [
                ['GAMES', 'Games'], ['APPS', 'Apps'], ['LINK', 'Links'], ['FILES', 'Files'], ['HOME', 'Home']
            ];
            const known = SECTIONS.map(s => s[0]);
            const other = items.filter(i => !known.includes(i.category));
            const groups = SECTIONS.map(([key, label]) => [key, label, items.filter(i => i.category === key)]);
            if (other.length) groups.push(['OTHER', 'Other', other]);

            const row = i => {
                const img = webUrl(i.image_url);
                return `
                <div class="item-row">
                    <div class="item-info">
                        <div class="thumb" style="${img ? `background-image:url('${esc(img)}')` : ''}"></div>
                        <span class="item-title">${esc(i.title)}</span>
                    </div>
                    <button class="btn-delete" data-id="${esc(i.id)}">DELETE</button>
                </div>`;
            };

            $('list').innerHTML = groups.filter(g => g[2].length).map(([key, label, rows]) => `
                <details class="group" data-cat="${esc(key)}" ${wasOpen.has(key) ? 'open' : ''}>
                    <summary>${esc(label)} <span class="count">${rows.length}</span></summary>
                    ${rows.map(row).join('')}
                </details>`).join('');
        }

        // ---------- Make every photo the same square tile ----------
        const TILE = 800; // final size in pixels (800 x 800)

        async function toTile(file) {
            // GIFs are left alone so they keep animating
            if (file.type === 'image/gif') return { blob: file, type: file.type, ext: 'gif' };

            const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
            const side = Math.min(bmp.width, bmp.height);          // biggest centered square
            const sx = (bmp.width - side) / 2;
            const sy = (bmp.height - side) / 2;
            const out = Math.min(TILE, side);                      // never blow small photos up
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = out;
            canvas.getContext('2d').drawImage(bmp, sx, sy, side, side, 0, 0, out, out);
            bmp.close && bmp.close();

            let blob = await new Promise(r => canvas.toBlob(r, 'image/webp', 0.85));
            if (blob && blob.type === 'image/webp') return { blob, type: 'image/webp', ext: 'webp' };
            blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.88));
            return { blob, type: 'image/jpeg', ext: 'jpg' };
        }

        // ---------- Save ----------
        async function save() {
            const title = $('title').value.trim();
            const category = $('category').value;
            const link = webUrl($('url').value.trim());
            const file = $('photo').files[0];
            let image_url = $('image_url').value.trim();

            if (!title) return say('save-msg', 'Add a title', 'err');
            if (!link) return say('save-msg', 'The link must start with https://', 'err');
            if (!file && !webUrl(image_url)) return say('save-msg', 'Pick a photo or paste an image link', 'err');
            if (file) {
                if (!ALLOWED_TYPES.includes(file.type)) return say('save-msg', 'Photo must be JPG, PNG, WEBP or GIF', 'err');
                if (file.size > MAX_BYTES) return say('save-msg', 'Photo is too big (max 15 MB)', 'err');
            }

            $('save-btn').disabled = true;
            say('save-msg', file ? 'Uploading photo...' : 'Saving...');

            try {
                if (file) {
                    say('save-msg', 'Resizing photo...');
                    const tile = await toTile(file);
                    say('save-msg', 'Uploading photo...');
                    const path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + tile.ext;
                    const { error: upErr } = await supabaseClient.storage.from(BUCKET).upload(path, tile.blob, { contentType: tile.type });
                    if (upErr) throw upErr;
                    image_url = supabaseClient.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
                }

                const { error } = await supabaseClient.from('files').insert([{ title, image_url, category, url: link }]);
                if (error) throw error;

                $('title').value = '';
                $('url').value = '';
                $('image_url').value = '';
                $('photo').value = '';
                $('preview').style.display = 'none';
                say('save-msg', 'Saved. It is live on the site.', 'ok');
                loadList();
            } catch (e) {
                say('save-msg', 'Failed: ' + (e.message || e), 'err');
            } finally {
                $('save-btn').disabled = false;
            }
        }

        // ---------- Delete ----------
        async function del(id) {
            if (!confirm('Delete this item?')) return;
            const { data: row } = await supabaseClient.from('files').select('image_url').eq('id', id).maybeSingle();
            const { error } = await supabaseClient.from('files').delete().eq('id', id);
            if (error) return alert('Delete failed: ' + error.message);

            // Also remove the photo file if it lives in our bucket
            const marker = '/storage/v1/object/public/' + BUCKET + '/';
            if (row && row.image_url && row.image_url.includes(marker)) {
                const path = decodeURIComponent(row.image_url.split(marker)[1].split('?')[0]);
                await supabaseClient.storage.from(BUCKET).remove([path]);
            }
            loadList();
        }

        // ---------- Wiring ----------
        $('login-btn').addEventListener('click', login);
        $('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
        $('logout-btn').addEventListener('click', logout);
        $('save-btn').addEventListener('click', save);
        $('list').addEventListener('click', e => {
            const b = e.target.closest('.btn-delete');
            if (b) del(b.dataset.id);
        });
        $('photo').addEventListener('change', () => {
            const f = $('photo').files[0];
            const p = $('preview');
            if (!f) { p.style.display = 'none'; return; }
            p.style.backgroundImage = "url('" + URL.createObjectURL(f) + "')";
            p.style.display = 'block';
        });

        supabaseClient.auth.getSession().then(({ data }) => showView(!!data.session));
    </script>
</body>
</html>
