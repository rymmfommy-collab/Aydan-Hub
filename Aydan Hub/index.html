            --hero-bg: linear-gradient(to bottom, rgba(7,5,18,0) 72%, #070512 100%), radial-gradient(circle at 18% 28%, rgba(125,95,255,0.40) 0%, transparent 42%), radial-gradient(circle at 82% 72%, rgba(255,0,222,0.28) 0%, transparent 42%), radial-gradient(circle at center, #1a103d 0%, #070512 70%);
            --hero-title-glow: 0 0 30px rgba(125,95,255,0.55);

            --card-bg: rgba(255,255,255,0.07); --card-border: rgba(255,255,255,0.10); --card-shadow: none;
            --gold: #d1b27a; --teal: #7dd3e0; --pill: rgba(255,255,255,0.10); --pill-on: rgba(255,255,255,0.20); --menu-bg: rgba(7,5,18,0.55); --page: #070512; --ac: #a58bff;

        body { margin: 0; background: var(--page); color: var(--ink); font-family: 'Inter', sans-serif; overflow-x: clip; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

        :root[data-theme="dark"] .icon-btn .sun { display: none; }

        /* full-page transparent menu */
        .menu { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: flex-end; padding: 22px 7% 40px; background: var(--menu-bg);

        .searchpill input::placeholder { color: var(--soft); }

            background: linear-gradient(120deg, #6a3df0, #c24dff 60%, #ff7ad9) center/cover; }
        .feat:after { content: ""; position: absolute; right: -40px; top: -40px; width: 190px; height: 190px; border-radius: 50%; background: rgba(255,255,255,0.18); }
        .feat.pic:after { display: none; }
        .feat.pic:before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,10,60,0.82), rgba(20,10,60,0.35) 70%, rgba(20,10,60,0.1)); }
        .feat > * { position: relative; z-index: 1; }
        .feat small { letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.65rem; opacity: 0.85; }
        .feat h2 { margin: 8px 0 6px; font-size: 1.5rem; line-height: 1.1; max-width: 16ch; }
        .feat p { margin: 0 0 14px; font-size: 0.85rem; opacity: 0.92; max-width: 34ch; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .feat .btn { align-self: flex-start; background: #fff; color: #6a3df0; font-weight: 800; border-radius: 999px; padding: 10px 20px; font-size: 0.8rem; }
        .sec { margin: 24px 0 12px; font-size: 1.1rem; font-weight: 800; }
        .apps { display: grid; gap: 10px; }
        .app { display: flex; align-items: center; gap: 14px; background: var(--card-bg); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: 0 4px 14px rgba(60,40,140,0.06); color: inherit; text-decoration: none; }
        .ico { flex: none; width: 56px; height: 56px; border-radius: 15px; color: #fff; font-weight: 900; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #7d5fff, #ff00de) center/cover; }
        .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .meta b { font-size: 0.98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta span { font-size: 0.8rem; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta i { font-style: normal; font-size: 0.7rem; color: var(--ac); font-weight: 700; }
        .get { flex: none; border: 1.5px solid var(--ac); color: var(--ac); font-weight: 800; font-size: 0.75rem; border-radius: 999px; padding: 8px 16px; }
        .rail { display: flex; flex-wrap: wrap; gap: 12px; }
        .rail.wrapped { flex-wrap: wrap; overflow: visible; }
        .gc { flex: none; width: 150px; box-sizing: border-box; background: var(--card-bg); border: 1px solid var(--line); border-radius: 16px; padding: 8px; box-shadow: 0 4px 14px rgba(60,40,140,0.06); color: inherit; text-decoration: none; }
        .gp { aspect-ratio: 4 / 3; border-radius: 11px; margin-bottom: 8px; background: linear-gradient(135deg, #ff7a59, #7d5fff) center/cover; }
        .gc b { display: block; font-size: 0.85rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .gc span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 0.72rem; color: var(--soft); margin-top: 2px; }
        .empty { color: var(--soft); padding: 22px 0; }
        .foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; box-sizing: border-box; padding: 12px 5%; text-align: center; color: var(--soft); font-size: 0.78rem; border-top: 1px solid var(--line); background: var(--card-bg); }
        body { box-sizing: border-box; padding-bottom: 46px; }
        @media (hover: hover) { .app:hover, .gc:hover { border-color: var(--ac); } }
        @media (min-width: 760px) { .apps { grid-template-columns: 1fr 1fr; } .feat { min-height: 210px; padding: 40px; } .feat h2 { font-size: 2.2rem; } .gc { width: 190px; } }
    </style>

<body>

    <script>
        const SUPABASE_URL = 'https://tvasdkfdizdwkroatgno.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UQ0g7DJ4_Um1nrAEd6z4nA_LnMUIcSA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let items = [];

        // Dark / light mode switch (remembered in this browser)
        document.getElementById('theme-btn').addEventListener('click', function () {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            const m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', next === 'dark' ? '#070512' : '#ffffff');
        });

        // Full-page transparent menu
        const menuEl = document.getElementById('menu');
        const menuBtn = document.getElementById('menu-btn');
        function setMenu(open) {
            menuEl.classList.toggle('open', open);
            menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
            document.documentElement.style.overflow = open ? 'hidden' : '';
        }
        menuBtn.addEventListener('click', () => setMenu(!menuEl.classList.contains('open')));
        document.getElementById('menu-close').addEventListener('click', () => setMenu(false));
        menuEl.addEventListener('click', (e) => { if (e.target === menuEl) setMenu(false); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
        const MENU_SECTIONS = { games: 'GAMES', apps: 'APPS', links: 'LINK' };
        menuEl.querySelectorAll('a[data-go]').forEach(function (a) {
            a.addEventListener('click', function (e) {
                e.preventDefault();
                setMenu(false);
                const go = a.getAttribute('data-go');
                if (MENU_SECTIONS[go]) openCat(MENU_SECTIONS[go]);
            });
        });

        // Store-style home: search pill + chips (All / Games / Apps / Links)
        const homeEl = document.getElementById('home');
        const searchInput = document.getElementById('search-input');
        let chip = 'all';
        const CHIPS = { games: 'GAMES', apps: 'APPS', links: 'LINK' };
        const LABEL = { GAMES: 'Game', APPS: 'App', LINK: 'Link' };

        function setChip(c) {
            chip = c;
            searchInput.value = '';
            document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.getAttribute('data-chip') === c));
            render();
        }
        document.getElementById('chips').addEventListener('click', function (e) {
            const b = e.target.closest('.chip'); if (b) setChip(b.getAttribute('data-chip'));
        });
        document.getElementById('search-btn').addEventListener('click', function () {
            window.scrollTo(0, 0); searchInput.focus();
        });
        searchInput.addEventListener('input', render);
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') { searchInput.value = ''; render(); } });

        function goHome() { setChip('all'); window.scrollTo(0, 0); }
        function openCat(cat) {
            const k = Object.keys(CHIPS).find(x => CHIPS[x] === cat);
            setChip(k || 'all'); window.scrollTo(0, 0);
        }

        async function load() {
            const { data, error } = await supabaseClient.from('files').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error('Supabase load error:', error);
                homeEl.innerHTML = '<p class="empty">Unable to load items right now.</p>';
                return;
            }
            items = data || [];
            render();
            openFromQuery();
        }

        // Addresses inside this website, e.g. /app/moviebox or /?s=games. Anything else is not accepted here.
        function internalPath(u) {
            const s = String(u || '');
            return /^\/(?!\/)[A-Za-z0-9\-._~\/?=&%#]*$/.test(s) ? s : '';
        }

        // /?s=games opens the Games filter (also apps, links); /?search=1 focuses the search box
        function openFromQuery() {
            const p = new URLSearchParams(location.search);
            const s = (p.get('s') || '').toLowerCase();
            if (CHIPS[s]) setChip(s);
            else if (p.get('search')) searchInput.focus();
        }

        // Escape text so titles can never inject HTML or scripts
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // Only allow normal web links
        function safeUrl(u) {
            try {
                const x = new URL(u);
                return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href.replace(/'/g, '%27') : '#';
            } catch (e) { return '#'; }
        }

        // Where an item opens: a chosen page inside the site, its own page, or its outside link
        function dest(i) {
            const d = internalPath(i.url);
            const internal = !!d || !!i.slug;
            const href = d || (i.slug ? '/app/' + encodeURIComponent(i.slug) : safeUrl(i.url));
            return { href, attrs: internal ? '' : ' target="_blank" rel="noopener noreferrer"' };
        }
        function picStyle(i) {
            const img = safeUrl(i.image_url || '');
            return img !== '#' ? ` style="background-image:url('${esc(img).replace(/'/g, '%27')}')"` : '';
        }
        function appRow(i) {
            const t = dest(i), pic = picStyle(i);
            const word = i.category === 'LINK' ? 'OPEN' : 'GET';
            return `<a class="app" href="${esc(t.href)}"${t.attrs}>
                <div class="ico"${pic}>${pic ? '' : esc((i.title || '?').trim().charAt(0).toUpperCase())}</div>
                <div class="meta"><b>${esc(i.title)}</b></div>
                <div class="get">${word}</div></a>`;
        }
        function gameCard(i) {
            const t = dest(i);
            return `<a class="gc" href="${esc(t.href)}"${t.attrs}><div class="gp"${picStyle(i)}></div><b>${esc(i.title)}</b>${i.description ? `<span>${esc(i.description)}</span>` : ''}</a>`;
        }
        function banner(i) {
            const t = dest(i), img = safeUrl(i.image_url || '');
            const st = img !== '#' ? ` style="background-image:url('${esc(img).replace(/'/g, '%27')}')"` : '';
            const desc = (i.description || '').trim();
            return `<a class="feat${img !== '#' ? ' pic' : ''}" href="${esc(t.href)}"${t.attrs}${st}><small>Featured</small><h2>${esc(i.title)}</h2>${desc ? `<p>${esc(desc)}</p>` : '<p></p>'}<span class="btn">View details</span></a>`;
        }

        function render() {
            const q = searchInput.value.trim().toLowerCase();
            const rest = items.filter(i => i.category !== 'HOME');
            const by = c => items.filter(i => i.category === c);
            let h = '';
            if (q) {
                const found = rest.filter(i => [i.title, i.description, i.developer].some(t => String(t || '').toLowerCase().includes(q)));
                h = `<h3 class="sec">Results</h3>` + (found.length ? `<div class="apps">${found.map(appRow).join('')}</div>` : `<p class="empty">No results for that search.</p>`);
            } else {
                const apps = by('APPS'), games = by('GAMES'), links = by('LINK'), home = by('HOME');
                if (chip === 'all' && home.length) h += `<div class="banners">${home.map(banner).join('')}</div>`;
                if ((chip === 'all' || chip === 'apps') && apps.length) h += `<h3 class="sec">${chip === 'all' ? 'Popular apps' : 'Apps'}</h3><div class="apps">${apps.map(appRow).join('')}</div>`;
                if ((chip === 'all' || chip === 'games') && games.length) h += `<h3 class="sec">Games</h3><div class="rail${chip === 'games' ? ' wrapped' : ''}">${games.map(gameCard).join('')}</div>`;
                if ((chip === 'all' || chip === 'links') && links.length) h += `<h3 class="sec">Links</h3><div class="apps">${links.map(appRow).join('')}</div>`;
                if (!h || (chip !== 'all' && !({games, apps, links})[chip].length)) h = `<p class="empty">No content in this section.</p>`;
            }
            homeEl.innerHTML = h;
        }
        load();
    </script>
</body>
</html>
