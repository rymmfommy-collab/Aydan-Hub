<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="pguMl4tskDKely2U8fS1zJ-V4GZD-fVGwDvB8wbOeVo" />
    <title>Aydan Hub | Metaverse</title>
    <meta name="description" content="Aydan Hub: apps, games, links and files, each with details and an official download link.">
    <meta name="theme-color" content="#070512">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --p: #7d5fff; --s: #ff00de; --bg: #070512; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* HEADER - FIXED & VISIBLE */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 5%; position: fixed; top: 0; width: 100%;
            box-sizing: border-box; z-index: 10000; background: rgba(7, 5, 18, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(15px);
        }
        .logo-box { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-img { width: 40px; height: 40px; display: block; filter: drop-shadow(0 0 8px rgba(125,95,255,0.45)); }
        .logo-name { font-weight: 900; letter-spacing: 2px; font-size: 1.1rem; }

        nav { display: flex; gap: 12px; }
        .nav-btn { color: #fff; text-decoration: none; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; cursor: pointer; padding: 8px; transition: 0.3s; }
        .nav-btn:hover { color: var(--s); text-shadow: 0 0 10px var(--s); }

        /* SECTIONS */
        #hero { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle at 18% 28%, rgba(125,95,255,0.40) 0%, transparent 42%), radial-gradient(circle at 82% 72%, rgba(255,0,222,0.28) 0%, transparent 42%), radial-gradient(circle at center, #1a103d 0%, #070512 70%); }

        /* FEATURED GLASS TILES (items uploaded to the HOME section).
           They float over the AYDAN HUB title; the name shows blurred through the glass. */
        #featured { display: none; position: relative; z-index: 2; margin-top: -62vh; padding: 0 5% 70px; }
        .tiles { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
        .tile {
            position: relative; z-index: 1; display: flex; flex-direction: column; padding: 10px;
            border-radius: 28px; color: #fff; text-decoration: none;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.28);
            box-shadow: 0 18px 40px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.45);
            -webkit-backdrop-filter: blur(9px) saturate(170%); backdrop-filter: blur(9px) saturate(170%);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .tile-img {
            width: 100%; aspect-ratio: 16 / 10; border-radius: 20px;
            background-size: cover; background-position: center;
            border: 1px solid rgba(255,255,255,0.22);
            opacity: 0.62; /* see-through, so the AYDAN HUB name glows through the glass */
        }
        .tile-body { padding: 14px 10px 10px; }
        .tile-title { margin: 0 0 6px; font-size: 1.35rem; font-weight: 900; line-height: 1.15; text-shadow: 0 1px 8px rgba(0,0,0,0.3); }
        .tile-desc { margin: 0; font-size: 0.88rem; line-height: 1.45; color: rgba(255,255,255,0.92); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        @media (hover: hover) { .tile:hover { transform: translateY(-4px); box-shadow: 0 24px 48px rgba(125,95,255,0.35), inset 0 1px 0 rgba(255,255,255,0.5); } }
        @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
        /* browsers without blur support get a darker panel so text is still readable */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .tile { background: rgba(20,16,50,0.78); }
        }
        .hero-title { font-size: clamp(3rem, 15vw, 6rem); font-weight: 900; letter-spacing: -2px; }

        #content { display: none; padding: 100px 5% 50px; min-height: 100vh; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        @media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; } }

        /* CARD STYLE */
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 8px; transition: 0.3s; }
        .card-title { margin: 0; font-size: 0.75rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card:hover { transform: translateY(-5px); border-color: var(--p); }
        .card-img { width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; background-size: cover; background-position: center; background-color: rgba(255,255,255,0.05); margin-bottom: 8px; }
        .card-link { display: block; color: inherit; text-decoration: none; }

        /* GAMES: bigger cards that list up to 3 links, each with a short description */
        .grid.games { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
        .games .card { padding: 12px; border-radius: 20px; }
        .games .card-img { aspect-ratio: 16 / 10; }
        .games .card-title { font-size: 1.05rem; white-space: normal; margin: 2px 0 10px; }
        .game-links { display: flex; flex-direction: column; gap: 8px; }
        .game-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; color: #fff; text-decoration: none; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); transition: 0.2s; }
        .game-link:hover { border-color: var(--p); background: rgba(125,95,255,0.14); }
        .gl-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .gl-name { font-size: 0.85rem; font-weight: 900; }
        .gl-desc { font-size: 0.75rem; line-height: 1.35; color: rgba(255,255,255,0.7); }
        .gl-go { flex-shrink: 0; background: linear-gradient(45deg, var(--p), var(--s)); border-radius: 8px; padding: 6px 12px; font-size: 0.7rem; font-weight: 900; }
        .btn-row { display: flex; margin-top: 8px; }
        .btn-main { flex: 1; background: linear-gradient(45deg, var(--p), var(--s)); color: #fff; text-decoration: none; text-align: center; padding: 7px; border-radius: 8px; font-weight: 900; font-size: 0.7rem; }

        @media (max-width: 600px) {
            header { padding: 10px 3%; }
            nav { gap: 5px; }
            .nav-btn { font-size: 0.6rem; padding: 5px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box" onclick="location.reload()">
            <img class="logo-img" src="logo.png" alt="Aydan Hub logo">
            <div class="logo-name">AYDAN</div>
        </div>
        <nav>
            <a class="nav-btn" onclick="location.reload()">Home</a>
            <a class="nav-btn" onclick="openCat('GAMES', 'NEON GAMES')">Games</a>
            <a class="nav-btn" onclick="openCat('APPS', 'APPS')">Apps</a>
            <a class="nav-btn" onclick="openCat('LINK', 'LINKS')">Links</a>
            <a class="nav-btn" onclick="openCat('FILES', 'STORAGE')">Files</a>
        </nav>
    </header>

    <section id="hero">
        <h1 class="hero-title">AYDAN<br><span style="color:transparent; -webkit-text-stroke: 1px #fff;">HUB</span></h1>
    </section>

    <section id="featured" aria-label="Highlights">
        <div class="tiles" id="tiles"></div>
    </section>

    <section id="content">
        <h2 id="view-title" style="margin-bottom:30px; text-transform:uppercase; color:var(--p);"></h2>
        <div class="grid" id="main-grid"></div>
    </section>

    <script>
        const SUPABASE_URL = 'https://tvasdkfdizdwkroatgno.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UQ0g7DJ4_Um1nrAEd6z4nA_LnMUIcSA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let items = [];

        async function load() {
            const { data } = await supabaseClient.from('files').select('*').order('created_at', { ascending: false });
            items = data || [];
            renderFeatured();
        }

        // Items uploaded to the HOME section show on the front page as glass tiles
        function renderFeatured() {
            const home = items.filter(i => i.category === 'HOME');
            const section = document.getElementById('featured');
            if (!home.length) { section.style.display = 'none'; return; }
            document.getElementById('tiles').innerHTML = home.map(i => {
                // Open the item's own page when it has one, otherwise its link
                const internal = !!i.slug;
                const href = internal ? '/app/' + encodeURIComponent(i.slug) : safeUrl(i.url);
                const img = safeUrl(i.image_url || '');
                const bg = (img !== '#' ? `url('${img}'), ` : '') + 'linear-gradient(135deg, #3a7bff, #1c4fd8)';
                const desc = (i.description || '').trim();
                return `
                <a class="tile" href="${esc(href)}" ${internal ? '' : 'target="_blank" rel="noopener noreferrer"'}>
                    <div class="tile-img" style="background-image: ${esc(bg)}"></div>
                    <div class="tile-body">
                        <h3 class="tile-title">${esc(i.title)}</h3>
                        ${desc ? `<p class="tile-desc">${esc(desc)}</p>` : ''}
                    </div>
                </a>`;
            }).join('');
            section.style.display = 'block';
        }

        // Escape text so titles can never inject HTML or scripts
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // Only allow normal web links
        function safeUrl(u) {
            try {
                const x = new URL(u);
                return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href.replace(/'/g, '%27') : '#';
            } catch (e) { return '#'; }
        }

        function openCat(cat, label) {
            document.getElementById('hero').style.display = 'none';
            document.getElementById('featured').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.getElementById('view-title').innerText = label;
            const filtered = items.filter(i => i.category === cat);
            const g = document.getElementById('main-grid');
            const isGames = cat === 'GAMES';
            g.className = 'grid' + (isGames ? ' games' : '');
            g.innerHTML = filtered.length ? filtered.map(i => {
                // Up to 3 extra links per game, each with its own short description
                const links = (Array.isArray(i.links) ? i.links : []).filter(l => l && safeUrl(l.url) !== '#').slice(0, 3);
                // Items with a slug get their own details page; the picture and title link to it
                const page = i.slug ? '/app/' + encodeURIComponent(i.slug) : '';
                const top = `
                    <div class="card-img" style="background-image: url('${esc(safeUrl(i.image_url || 'https://via.placeholder.com/400x200'))}')"></div>
                    <h3 class="card-title">${esc(i.title)}</h3>`;
                if (isGames && links.length) {
                    return `
                <div class="card">
                    ${page ? `<a class="card-link" href="${esc(page)}">${top}</a>` : top}
                    <div class="game-links">
                        ${links.map(l => `
                        <a class="game-link" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer">
                            <span class="gl-text">
                                <span class="gl-name">${esc(l.label || 'Link')}</span>
                                ${l.description ? `<span class="gl-desc">${esc(l.description)}</span>` : ''}
                            </span>
                            <span class="gl-go">GET</span>
                        </a>`).join('')}
                    </div>
                </div>`;
                }
                return `
                <div class="card">
                    ${page ? `<a class="card-link" href="${esc(page)}">${top}</a>` : top}
                    ${(i.category === 'APPS' && page) ? '' : `<div class="btn-row">
                        <a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener noreferrer" class="btn-main">GET</a>
                    </div>`}
                </div>`;
            }).join('') : `<p>No content in this section.</p>`;
            window.scrollTo(0,0);
        }
        load();
    </script>
</body>
</html>
