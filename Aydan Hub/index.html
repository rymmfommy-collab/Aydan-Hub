    <style>
        :root {
            --p: #7d5fff; --s: #ff00de;
            --bg: #ffffff; --ink: #14102e; --soft: #5b5683; --desc: #2b2552;
            --header-bg: rgba(255,255,255,0.92); --line: rgba(125,95,255,0.22); --header-shadow: 0 4px 24px rgba(125,95,255,0.12);
            --hero-bg: linear-gradient(to bottom, rgba(255,255,255,0) 72%, #ffffff 100%), radial-gradient(circle at 18% 28%, rgba(125,95,255,0.30) 0%, transparent 45%), radial-gradient(circle at 82% 72%, rgba(255,0,222,0.22) 0%, transparent 45%), radial-gradient(circle at center, #ffffff 0%, #f3f0ff 75%);
            --hero-title-glow: 0 0 28px rgba(125,95,255,0.35);
            --tile-bg: rgba(255,255,255,0.42); --tile-border: rgba(125,95,255,0.40);
            --tile-shadow: 0 14px 36px rgba(125,95,255,0.22), 0 0 0 1px rgba(255,255,255,0.7) inset, 0 0 18px rgba(255,0,222,0.10);
            --tile-shadow-hover: 0 24px 48px rgba(125,95,255,0.38), 0 0 26px rgba(255,0,222,0.22);
            --tile-title-shadow: 0 1px 10px rgba(255,255,255,0.8); --tile-fallback: rgba(255,255,255,0.92);
            --pic-bg: #efeaff; --pic-border: rgba(125,95,255,0.30);
            --card-bg: #ffffff; --card-border: rgba(125,95,255,0.22); --card-shadow: 0 6px 18px rgba(125,95,255,0.10);
            --gold: #8a6d3b; --teal: #1b6b78; --pill: #efeaff; --pill-on: #ffffff; --menu-bg: rgba(250,247,255,0.55); --page: #ffffff; --ac: #6a3df0;
        }
        :root[data-theme="dark"] {
            --bg: #070512; --ink: #ffffff; --soft: #b9b3dd; --desc: rgba(255,255,255,0.92);
            --header-bg: rgba(7,5,18,0.92); --line: rgba(255,255,255,0.12); --header-shadow: 0 4px 24px rgba(0,0,0,0.35);
            --hero-bg: linear-gradient(to bottom, rgba(7,5,18,0) 72%, #070512 100%), radial-gradient(circle at 18% 28%, rgba(125,95,255,0.40) 0%, transparent 42%), radial-gradient(circle at 82% 72%, rgba(255,0,222,0.28) 0%, transparent 42%), radial-gradient(circle at center, #1a103d 0%, #070512 70%);
            --hero-title-glow: 0 0 30px rgba(125,95,255,0.55);
            --tile-bg: rgba(255,255,255,0.10); --tile-border: rgba(255,255,255,0.28);
            --tile-shadow: 0 18px 40px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.45), 0 0 18px rgba(125,95,255,0.18);
            --tile-shadow-hover: 0 24px 48px rgba(125,95,255,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
            --tile-title-shadow: 0 1px 8px rgba(0,0,0,0.35); --tile-fallback: rgba(20,16,50,0.85);
            --pic-bg: rgba(255,255,255,0.06); --pic-border: rgba(255,255,255,0.22);
            --card-bg: rgba(255,255,255,0.04); --card-border: rgba(255,255,255,0.10); --card-shadow: none;
            --gold: #d1b27a; --teal: #7dd3e0; --pill: rgba(255,255,255,0.10); --pill-on: rgba(255,255,255,0.20); --menu-bg: rgba(7,5,18,0.55); --page: #070512; --ac: #8b6dff;
        }
        body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* HEADER: logo at the left, title in the middle, buttons at the right */
        .site-head { position: relative; z-index: 30; background: var(--header-bg); border-bottom: 1px solid var(--line); }
        .site-row { display: flex; align-items: center; gap: 8px; padding: 10px 4%; }
        .logo { flex: none; display: block; }
        .logo img { width: 46px; height: 46px; display: block; filter: drop-shadow(0 0 8px rgba(125,95,255,0.35)); }
        .site-title { flex: 1; min-width: 0; text-align: center; text-decoration: none; color: inherit; }
        .kicker { font-size: 0.56rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
        .brand-name { font-size: 1.05rem; font-weight: 800; margin: 2px 0; letter-spacing: -0.2px; line-height: 1.1; }
        .brand-tag { font-size: 0.62rem; color: var(--teal); letter-spacing: 0.02em; line-height: 1.25; }
        .acts { flex: none; display: flex; align-items: center; gap: 4px; }
        .icon-btn { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); text-decoration: none; }
        .icon-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .icon-btn:hover { color: var(--p); }
        .icon-btn.round { width: 38px; height: 38px; margin-right: 2px; border: 1px solid var(--line); border-radius: 50%; }
        .icon-btn.round svg { width: 20px; height: 20px; }
        :root[data-theme="light"] .icon-btn .moon { display: none; }
        :root[data-theme="dark"] .icon-btn .sun { display: none; }
        .searchbar { display: none; padding: 10px 5%; border-top: 1px solid var(--line); background: var(--bg); }
        .searchbar.open { display: block; }
        .searchbar input { width: 100%; box-sizing: border-box; font: inherit; color: var(--ink); background: var(--pic-bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
        /* full-page transparent menu */
        .menu { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: flex-end; padding: 22px 7% 40px; background: var(--menu-bg);
            -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
            opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s; }
        .menu.open { opacity: 1; visibility: visible; }
        .menu .close { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--header-bg); display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 26px; padding: 0; color: var(--ink); }
        .menu .close svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
        .menu a { display: block; text-align: right; padding: 14px 4px; font-weight: 900; font-size: clamp(1.8rem, 8vw, 2.6rem); letter-spacing: -0.5px; text-transform: uppercase; color: var(--ink); text-decoration: none; }
        .menu a:hover { color: var(--p); }
        .menu .menu-brand { margin-top: auto; align-self: center; font-size: 0.7rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); }
        @media (prefers-reduced-motion: reduce) { .menu { transition: none; } }

        /* SECTIONS */
        /* FEATURED GLASS TILES (items uploaded to the HOME section).
           They sit right under the header. */
        #featured { display: none; position: relative; z-index: 2; padding: 26px 5% 70px; }
        .tiles { max-width: 1100px; margin: 0 auto; align-items: stretch; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
        @media (max-width: 600px) { .tiles { max-width: 310px; } }
        .tile {
            position: relative; z-index: 1; display: flex; flex-direction: column; padding: 10px;
            border-radius: 28px; color: var(--ink); text-decoration: none;
            background: var(--tile-bg);
            border: 1px solid var(--tile-border);
            box-shadow: var(--tile-shadow);
            -webkit-backdrop-filter: blur(9px) saturate(170%); backdrop-filter: blur(9px) saturate(170%);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        /* Every HOME tile picture has the same wide shape (97:59, the exact proportions of the chosen layout tile). The whole photo is always visible;
           a soft blurred copy of it fills any empty space at the sides or top and bottom. */
        .tile-pic { position: relative; aspect-ratio: 97 / 59; width: 100%; overflow: hidden; border-radius: 20px; border: 1px solid var(--pic-border); background: var(--pic-bg); }
        .tile-pic .bg { position: absolute; inset: -16px; background-size: cover; background-position: center; filter: blur(16px) saturate(1.2); opacity: 0.75; }
        .tile-pic img { position: relative; display: block; width: 100%; height: 100%; object-fit: contain; }
        .tile-pic.ph { background: linear-gradient(135deg, #7d5fff, #ff00de); }
        .tile-body { box-sizing: border-box; height: calc(5.75rem + 20px); overflow: hidden; padding: 12px 8px 8px; } /* same height for every HOME tile */
        .tile-title { margin: 0 0 6px; font-size: 1.2rem; font-weight: 900; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: var(--tile-title-shadow); }
        .tile-desc { margin: 0; font-size: 0.88rem; line-height: 1.45; color: var(--desc); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        @media (hover: hover) { .tile:hover { transform: translateY(-4px); box-shadow: var(--tile-shadow-hover); } }
        @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
        /* browsers without blur support get a darker panel so text is still readable */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .tile { background: var(--tile-fallback); }
        }
        #content { display: none; padding: 26px 5% 50px; min-height: 60vh; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        @media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; } }

        /* CARD STYLE */
        .card { background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--card-shadow); border-radius: 14px; padding: 8px; transition: 0.3s; }
        .card-title { margin: 0; font-size: 0.75rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card:hover { transform: translateY(-5px); border-color: var(--p); }
        .card-img { width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; background-size: cover; background-position: center; background-color: var(--pic-bg); margin-bottom: 8px; }
        .card-link { display: block; color: inherit; text-decoration: none; }

        /* GAMES: compact tiles (a little larger than the default). The links are inside each game's page. */
        .grid.games { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        @media (min-width: 700px) { .grid.games { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; } }
        .btn-row { display: flex; margin-top: 8px; }
        .btn-main { flex: 1; background: linear-gradient(45deg, var(--p), var(--s)); color: #fff; text-decoration: none; text-align: center; padding: 7px; border-radius: 8px; font-weight: 900; font-size: 0.7rem; }

        /* BOTTOM BAR (only on the All view): Contact, Ask, Socials */
        .foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; box-sizing: border-box; padding: 8px 5% 10px; text-align: center; color: var(--soft); font-size: 0.68rem; border-top: 1px solid var(--line); background: var(--card-bg); display: none; }
        body.on-all .foot { display: block; }
        :root[data-theme="dark"] .foot { background: #0d0a1f; }
        body { box-sizing: border-box; }
        body.on-all { padding-bottom: 76px; }
        .bar-icons { display: flex; justify-content: center; gap: 14px; }
        .bi { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--page); color: var(--ac); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
        .bi svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .bi.on { background: var(--ac); color: #fff; border-color: var(--ac); }
        .tagline { margin-top: 6px; }
        .sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 86px; z-index: 25; width: min(92%, 420px); box-sizing: border-box; background: var(--card-bg); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: 0 18px 44px rgba(60,40,140,0.25); display: none; text-align: left; }
        :root[data-theme="dark"] .sheet { background: #17122f; }
        .sheet.open { display: block; }
        .sheet h4 { margin: 0 0 10px; font-size: 1rem; color: var(--ink); }
        .sheet a.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 0.9rem; }
        .sheet a.row:first-of-type { border-top: 0; }
        .sheet a.row svg { width: 20px; height: 20px; stroke: var(--ac); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
        .sheet input, .sheet textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 0.9rem; color: var(--ink); background: var(--page); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
        .sheet textarea { min-height: 80px; resize: none; }
        .sheet .send { width: 100%; border: 0; border-radius: 999px; padding: 11px; background: var(--ac); color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
        .sheet .send:disabled { opacity: 0.6; }
        .sheet .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
        #ask-msg { margin: 8px 0 0; font-size: 0.82rem; color: var(--soft); min-height: 1.1em; }
        #ask-msg.ok { color: #1a8f5a; } #ask-msg.err { color: #c0392b; }
        .soc { display: flex; gap: 12px; flex-wrap: wrap; }
        .soc a { height: 44px; padding: 0 14px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--ac); color: #fff; font-weight: 800; font-size: 0.85rem; text-decoration: none; }
        .soc a svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>

<div class="foot" id="foot">

    <script>
        const SUPABASE_URL = 'https://tvasdkfdizdwkroatgno.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UQ0g7DJ4_Um1nrAEd6z4nA_LnMUIcSA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let items = [];

        // Dark / light mode switch (remembered in this browser)
        document.getElementById('theme-btn').addEventListener('click', function () {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            const m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', next === 'dark' ? '#070512' : '#ffffff');
        });

        // Full-page transparent menu
        const menuEl = document.getElementById('menu');
        const menuBtn = document.getElementById('menu-btn');
        function setMenu(open) {
            menuEl.classList.toggle('open', open);
            menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
            document.documentElement.style.overflow = open ? 'hidden' : '';
        }
        menuBtn.addEventListener('click', () => setMenu(!menuEl.classList.contains('open')));
        document.getElementById('menu-close').addEventListener('click', () => setMenu(false));
        menuEl.addEventListener('click', (e) => { if (e.target === menuEl) setMenu(false); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
        const MENU_SECTIONS = { games: ['GAMES', 'GAMES'], apps: ['APPS', 'APPS'], links: ['LINK', 'LINKS'] };
        menuEl.querySelectorAll('a[data-go]').forEach(function (a) {
            a.addEventListener('click', function (e) {
                e.preventDefault();
                setMenu(false);
                const go = a.getAttribute('data-go');
                if (go === 'home') goHome(); else openCat(MENU_SECTIONS[go][0], MENU_SECTIONS[go][1]);
            });
        });

        // Search: finds items by title, description or developer
        const searchBar = document.getElementById('searchbar');
        const searchInput = document.getElementById('search-input');
        function setSearch(open) {
            searchBar.classList.toggle('open', open);
            document.getElementById('search-btn').setAttribute('aria-expanded', open ? 'true' : 'false');
            if (open) searchInput.focus(); else { searchInput.value = ''; goHome(); }
        }
        document.getElementById('search-btn').addEventListener('click', () => setSearch(!searchBar.classList.contains('open')));
        searchInput.addEventListener('input', function () {
            const q = searchInput.value.trim().toLowerCase();
            if (!q) { goHome(true); return; }
            const found = items.filter(i => i.category !== 'HOME' && [i.title, i.description, i.developer].some(t => String(t || '').toLowerCase().includes(q)));
            showCards(found, false, 'No results for that search.');
        });
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') setSearch(false); });

        // Back to the front page
        function goHome(keepSearch) {
            document.getElementById('content').style.display = 'none';
            if (!keepSearch) { searchBar.classList.remove('open'); searchInput.value = ''; }
            try { if (location.search) history.replaceState(null, '', location.pathname); } catch (e) {}
            renderFeatured();
            window.scrollTo(0, 0);
        }

        async function load() {
            const { data } = await supabaseClient.from('files').select('*').order('created_at', { ascending: false });
            items = data || [];
            renderFeatured();
            openFromQuery();
        }

        // Addresses inside this website, e.g. /app/moviebox or /?s=games. Anything else is not accepted here.
        function internalPath(u) {
            const s = String(u || '');
            return /^\/(?!\/)[A-Za-z0-9\-._~\/?=&%#]*$/.test(s) ? s : '';
        }

        // /?s=games opens the Games section (and apps, links, files)
        const SECTION_LINKS = { games: ['GAMES', 'GAMES'], apps: ['APPS', 'APPS'], links: ['LINK', 'LINKS'] };
        function openFromQuery() {
            const s = new URLSearchParams(location.search).get('s');
            const sec = s && SECTION_LINKS[s.toLowerCase()];
            if (sec) openCat(sec[0], sec[1]);
            else if (new URLSearchParams(location.search).get('search')) setSearch(true);
        }

        // Items uploaded to the HOME section show on the front page as glass tiles
        function renderFeatured() {
            const home = items.filter(i => i.category === 'HOME');
            const section = document.getElementById('featured');
            if (!home.length) { section.style.display = 'none'; syncBar(); return; }
            document.getElementById('tiles').innerHTML = home.map(i => {
                // Open the item's own page when it has one, otherwise its link
                // A chosen page inside the site wins, then the item's own page, then an outside link
                const dest = internalPath(i.url);
                const internal = !!dest || !!i.slug;
                const href = dest || (i.slug ? '/app/' + encodeURIComponent(i.slug) : safeUrl(i.url));
                const img = safeUrl(i.image_url || '');
                const desc = (i.description || '').trim();
                return `
                <a class="tile" href="${esc(href)}" ${internal ? '' : 'target="_blank" rel="noopener noreferrer"'}>
                    ${img !== '#'
                        ? `<div class="tile-pic"><div class="bg" style="background-image:url('${esc(img).replace(/'/g, '%27')}')"></div><img src="${esc(img)}" alt="${esc(i.title)}" loading="lazy" decoding="async" onerror="this.parentNode.className='tile-pic ph';this.remove()"></div>`
                        : `<div class="tile-pic ph"></div>`}
                    <div class="tile-body">
                        <h3 class="tile-title">${esc(i.title)}</h3>
                        ${desc ? `<p class="tile-desc">${esc(desc)}</p>` : ''}
                    </div>
                </a>`;
            }).join('');
            section.style.display = 'block';
            syncBar();
        }

        // Escape text so titles can never inject HTML or scripts
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // Only allow normal web links
        function safeUrl(u) {
            try {
                const x = new URL(u);
                return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href.replace(/'/g, '%27') : '#';
            } catch (e) { return '#'; }
        }

        function openCat(cat, label) {
            showCards(items.filter(i => i.category === cat), cat === 'GAMES', 'No content in this section.');
        }

        function showCards(filtered, isGames, emptyText) {
            document.getElementById('featured').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            const g = document.getElementById('main-grid');
            g.className = 'grid' + (isGames ? ' games' : '');
            g.innerHTML = filtered.length ? filtered.map(i => {
                // Up to 4 extra links per game (listed on the game's own page)
                const links = (Array.isArray(i.links) ? i.links : []).filter(l => l && safeUrl(l.url) !== '#').slice(0, 4);
                // Items with a slug get their own details page; the picture and title link to it
                const page = i.slug ? '/app/' + encodeURIComponent(i.slug) : '';
                const top = `
                    <div class="card-img" style="background-image: url('${esc(safeUrl(i.image_url || 'https://via.placeholder.com/400x200'))}')"></div>
                    <h3 class="card-title">${esc(i.title)}</h3>`;
                // Games with links open their own page (where the links are listed), so no GET button on the tile
                return `
                <div class="card">
                    ${page ? `<a class="card-link" href="${esc(page)}">${top}</a>` : top}
                    ${(page && (i.category === 'APPS' || links.length)) ? '' : `<div class="btn-row">
                        <a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener noreferrer" class="btn-main">GET</a>
                    </div>`}
                </div>`;
            }).join('') : `<p>${esc(emptyText)}</p>`;
            window.scrollTo(0, 0);
            syncBar();
        }
        // ---- Bottom bar: Contact, Ask, Socials (only shown on the All view) ----
        // EDIT HERE: your contact details and social links. Leave a value empty ('') to hide it.
        const CONTACT_EMAIL = 'rymmfommy@gmail.com';
        const CONTACT_WHATSAPP_LINK = 'https://wa.me/message/KB6SUQEBLLDDP1/';
        const SOCIALS = [
            { name: 'Instagram', url: 'https://www.instagram.com/cabtechtiktok?avpt=YXNiN3AydGx2cnE4', bg: 'linear-gradient(135deg,#f58529,#dd2a7b,#8134af)', g: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6"/>' },
            { name: 'YouTube', url: 'https://youtube.com/@mfsquoted?si=Wm3FrgRr2x1Uqjbb', bg: '#ff0000', g: '<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9l5 3-5 3z"/>' },
            { name: 'Facebook', url: 'https://www.facebook.com/share/1FPhXANVyZ/', bg: '#1877f2', g: '<path d="M14 21v-8h2.6l.4-3h-3V8.2c0-.9.3-1.5 1.6-1.5H17V4.1A20 20 0 0 0 14.8 4C12.6 4 11 5.4 11 7.8V10H8.5v3H11v8"/>' },
            { name: 'TikTok', url: 'https://www.tiktok.com/@xcab521', bg: '#111111', g: '<path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 4c.4 2.4 2 4 4.5 4.2"/>' }
        ];
        const SVG = (p) => '<svg viewBox="0 0 24 24">' + p + '</svg>';
        (function buildBar() {
            const rows = [];
            if (CONTACT_EMAIL) rows.push(`<a class="row" href="mailto:${esc(CONTACT_EMAIL)}">${SVG('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>')} ${esc(CONTACT_EMAIL)}</a>`);
            if (safeUrl(CONTACT_WHATSAPP_LINK) !== '#') rows.push(`<a class="row" href="${esc(safeUrl(CONTACT_WHATSAPP_LINK))}" target="_blank" rel="noopener noreferrer">${SVG('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>')} WhatsApp</a>`);
            document.getElementById('contact-rows').innerHTML = rows.join('') || '<p class="empty" style="padding:0">Use the Ask box.</p>';
            const soc = SOCIALS.filter(x => safeUrl(x.url) !== '#');
            document.getElementById('soc-links').innerHTML = soc.length
                ? soc.map(x => `<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer" aria-label="${esc(x.name)}" style="background:${x.bg}">${SVG(x.g)}${esc(x.name)}</a>`).join('')
                : '<p class="empty" style="padding:0">Coming soon.</p>';
        })();
        function closeSheets() {
            document.querySelectorAll('.sheet').forEach(x => x.classList.remove('open'));
            document.querySelectorAll('.bi').forEach(x => x.classList.remove('on'));
        }
        function syncBar() {
            document.body.classList.toggle('on-all', document.getElementById('content').style.display !== 'block');
            closeSheets();
        }
        document.querySelectorAll('.bi').forEach(b => b.addEventListener('click', () => {
            const sh = document.getElementById('sheet-' + b.dataset.sheet);
            const was = sh.classList.contains('open');
            closeSheets();
            if (!was) { sh.classList.add('open'); b.classList.add('on'); }
        }));
        document.addEventListener('click', (e) => { if (!e.target.closest('.foot')) closeSheets(); });
        const ASK_ERR = { links: 'Please remove links from your message.', busy: 'Too many questions right now. Try again in a few minutes.', bad_name: 'Please enter your name.', bad_body: 'Please write your question (2 to 1000 characters).', bad_contact: 'The contact detail is too long.' };
        document.getElementById('ask-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const msg = document.getElementById('ask-msg'), btn = document.getElementById('ask-send');
            if (document.getElementById('ask-hp').value) { msg.className = 'ok'; msg.textContent = 'Thank you! We got your question.'; return; }
            btn.disabled = true; msg.className = ''; msg.textContent = 'Sending...';
            try {
                const { data, error } = await supabaseClient.rpc('submit_question', {
                    p_name: document.getElementById('ask-name').value,
                    p_contact: document.getElementById('ask-contact').value,
                    p_body: document.getElementById('ask-body').value
                });
                if (error || !data) throw new Error('fail');
                if (data === 'ok') { msg.className = 'ok'; msg.textContent = 'Thank you! We got your question.'; document.getElementById('ask-body').value = ''; }
                else { msg.className = 'err'; msg.textContent = ASK_ERR[data] || 'Could not send. Please try again.'; }
            } catch (err) { msg.className = 'err'; msg.textContent = 'Could not send. Please try again.'; }
            btn.disabled = false;
        });
        load();
    </script>
</body>
</html>
