                <button class="icon-btn" id="search-btn" type="button" aria-label="Search" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
                <button class="icon-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
            </div>
        </div>
    </header>
    <nav class="menu" id="menu" aria-label="Menu">
        <button class="close" id="menu-close" type="button" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
        <a href="/?s=games" data-go="games">Games</a>
        <a href="/?s=apps" data-go="apps">Apps</a>
        <a href="/?s=links" data-go="links">Descriptions</a>
        <div class="menu-brand">çábTech</div>
    </nav>

    <main class="wrap">
        <label class="searchpill"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search-input" type="search" placeholder="Search apps and games" autocomplete="off" aria-label="Search apps and games"></label>
        <div class="chips" id="chips" role="tablist">
            <button class="chip on" type="button" data-chip="all">All</button>
            <button class="chip" type="button" data-chip="games">Games</button>
            <button class="chip" type="button" data-chip="apps">Apps</button>
            <button class="chip" type="button" data-chip="links">Descriptions</button>
        </div>
        <div id="home"><p class="empty">Loading...</p></div>
    </main>
    <div class="foot" id="foot">
        <div class="sheet" id="sheet-contact"><h4>Contact us</h4><div id="contact-rows"></div></div>
        <div class="sheet" id="sheet-ask"><h4>Ask us anything</h4>
            <form id="ask-form" autocomplete="off">
                <input id="ask-name" placeholder="Your name" maxlength="40" required>
                <input id="ask-contact" placeholder="Email or phone, so we can reply (optional)" maxlength="80">
                <textarea id="ask-body" placeholder="Your question" maxlength="1000" required></textarea>
                <input class="hp" id="ask-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
                <button class="send" id="ask-send" type="submit">Send</button>
                <p id="ask-msg" role="status"></p>
            </form></div>
        <div class="sheet" id="sheet-soc"><h4>Follow çábTech</h4><div class="soc" id="soc-links"></div></div>
        <div class="bar-icons">
            <button class="bi" type="button" data-sheet="contact" aria-label="Contact us"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></button>
            <button class="bi" type="button" data-sheet="ask" aria-label="Ask a question"><svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z"/></svg></button>
            <button class="bi" type="button" data-sheet="soc" aria-label="Social media"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></svg></button>
        </div>
        <div class="tagline">&copy; çábTech &middot; Let's Sail into Technology</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tvasdkfdizdwkroatgno.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UQ0g7DJ4_Um1nrAEd6z4nA_LnMUIcSA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let items = [];

        // Dark / light mode switch (remembered in this browser)
        document.getElementById('theme-btn').addEventListener('click', function () {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            const m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', next === 'dark' ? '#07051a' : '#e9e4ff');
        });

        // Full-page transparent menu
        const menuEl = document.getElementById('menu');
        const menuBtn = document.getElementById('menu-btn');
        function setMenu(open) {
            menuEl.classList.toggle('open', open);
            menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
            document.documentElement.style.overflow = open ? 'hidden' : '';
        }
        menuBtn.addEventListener('click', () => setMenu(!menuEl.classList.contains('open')));
        document.getElementById('menu-close').addEventListener('click', () => setMenu(false));
        menuEl.addEventListener('click', (e) => { if (e.target === menuEl) setMenu(false); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
        const MENU_SECTIONS = { games: 'GAMES', apps: 'APPS', links: 'LINK' };
        menuEl.querySelectorAll('a[data-go]').forEach(function (a) {
            a.addEventListener('click', function (e) {
                e.preventDefault();
                setMenu(false);
                const go = a.getAttribute('data-go');
                if (MENU_SECTIONS[go]) openCat(MENU_SECTIONS[go]);
            });
        });

        // Store-style home: search pill + chips (All / Games / Apps / Descriptions)
        const homeEl = document.getElementById('home');
        const searchInput = document.getElementById('search-input');
        let chip = 'all';
        const CHIPS = { games: 'GAMES', apps: 'APPS', links: 'LINK' };
        const LABEL = { GAMES: 'Game', APPS: 'App', LINK: 'Description' };

        function setChip(c) {
            chip = c;
            searchInput.value = '';
            document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.getAttribute('data-chip') === c));
            render();
        }
        document.getElementById('chips').addEventListener('click', function (e) {
            const b = e.target.closest('.chip'); if (b) setChip(b.getAttribute('data-chip'));
        });
        document.getElementById('search-btn').addEventListener('click', function () {
            window.scrollTo(0, 0); searchInput.focus();
        });
        searchInput.addEventListener('input', render);
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') { searchInput.value = ''; render(); } });

        function goHome() { setChip('all'); window.scrollTo(0, 0); }
        function openCat(cat) {
            const k = Object.keys(CHIPS).find(x => CHIPS[x] === cat);
            setChip(k || 'all'); window.scrollTo(0, 0);
        }

        async function load() {
            const { data, error } = await supabaseClient.from('files').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error('Supabase load error:', error);
                homeEl.innerHTML = '<p class="empty">Unable to load items right now.</p>';
                return;
            }
            items = data || [];
            render();
            openFromQuery();
        }

        // Addresses inside this website, e.g. /app/moviebox or /?s=games. Anything else is not accepted here.
        function internalPath(u) {
            const s = String(u || '');
            return /^\/(?!\/)[A-Za-z0-9\-._~\/?=&%#]*$/.test(s) ? s : '';
        }

        // /?s=games opens the Games filter (also apps, links); /?search=1 focuses the search box
        function openFromQuery() {
            const p = new URLSearchParams(location.search);
            const s = (p.get('s') || '').toLowerCase();
            if (CHIPS[s]) setChip(s);
            else if (p.get('search')) searchInput.focus();
        }

        // Escape text so titles can never inject HTML or scripts
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // Only allow normal web links
        function safeUrl(u) {
            try {
                const x = new URL(u);
                return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href.replace(/'/g, '%27') : '#';
            } catch (e) { return '#'; }
        }

        // Where an item opens: a chosen page inside the site, its own page, or its outside link
        function dest(i) {
            const d = internalPath(i.url);
            const internal = !!d || !!i.slug;
            const href = d || (i.slug ? '/app/' + encodeURIComponent(i.slug) : safeUrl(i.url));
            return { href, attrs: internal ? '' : ' target="_blank" rel="noopener noreferrer"' };
        }
        function picStyle(i) {
            const img = safeUrl(i.image_url || '');
            return img !== '#' ? ` style="background-image:url('${esc(img).replace(/'/g, '%27')}')"` : '';
        }
        function appRow(i) {
            const t = dest(i), pic = picStyle(i);
            const word = i.category === 'LINK' ? 'OPEN' : 'GET';
            return `<a class="app" href="${esc(t.href)}"${t.attrs}>
                <div class="ico"${pic}>${pic ? '' : esc((i.title || '?').trim().charAt(0).toUpperCase())}</div>
                <div class="meta"><b>${esc(i.title)}</b></div>
                <div class="get">${word}</div></a>`;
        }
        function gameCard(i) {
            const t = dest(i);
            return `<a class="gc" href="${esc(t.href)}"${t.attrs}><div class="gp"${picStyle(i)}></div><b>${esc(i.title)}</b>${i.description ? `<span>${esc(i.description)}</span>` : ''}</a>`;
        }
        function banner(i) {
            const t = dest(i), img = safeUrl(i.image_url || '');
            const st = img !== '#' ? ` style="background-image:url('${esc(img).replace(/'/g, '%27')}')"` : '';
            const desc = (i.description || '').trim();
            return `<a class="feat${img !== '#' ? ' pic' : ''}" href="${esc(t.href)}"${t.attrs}${st}><small>Featured</small><h2>${esc(i.title)}</h2>${desc ? `<p>${esc(desc)}</p>` : '<p></p>'}<span class="btn">View details</span></a>`;
        }

        function render() {
            const q = searchInput.value.trim().toLowerCase();
            const rest = items.filter(i => i.category !== 'HOME');
            const by = c => items.filter(i => i.category === c);
            let h = '';
            if (q) {
                const found = rest.filter(i => [i.title, i.description, i.developer].some(t => String(t || '').toLowerCase().includes(q)));
                h = `<h3 class="sec">Results</h3>` + (found.length ? `<div class="apps">${found.map(appRow).join('')}</div>` : `<p class="empty">No results for that search.</p>`);
            } else {
                const apps = by('APPS'), games = by('GAMES'), links = by('LINK'), home = by('HOME');
                if (chip === 'all' && home.length) h += `<div class="banners">${home.map(banner).join('')}</div>`;
                if ((chip === 'all' || chip === 'apps') && apps.length) h += `<h3 class="sec">${chip === 'all' ? 'Popular apps' : 'Apps'}</h3><div class="apps">${apps.map(appRow).join('')}</div>`;
                if ((chip === 'all' || chip === 'games') && games.length) h += `<h3 class="sec">Games</h3><div class="rail${chip === 'games' ? ' wrapped' : ''}">${games.map(gameCard).join('')}</div>`;
                if ((chip === 'all' || chip === 'links') && links.length) h += `<h3 class="sec">Descriptions</h3><div class="apps">${links.map(appRow).join('')}</div>`;
                if (!h || (chip !== 'all' && !({games, apps, links})[chip].length)) h = `<p class="empty">No content in this section.</p>`;
            }
            homeEl.innerHTML = h;
            syncBar();
        }

        // ---- Bottom bar: Contact, Ask, Socials (only shown on the All view) ----
        // EDIT HERE: your contact details and social links. Leave a value empty ('') to hide it.
        const CONTACT_EMAIL = 'rymmfommy@gmail.com';
        const CONTACT_WHATSAPP_LINK = 'https://wa.me/message/KB6SUQEBLLDDP1/';
        const SOCIALS = [
            { name: 'Instagram', url: 'https://www.instagram.com/cabtechtiktok?avpt=YXNiN3AydGx2cnE4', bg: 'linear-gradient(135deg,#f58529,#dd2a7b,#8134af)', g: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6"/>' },
            { name: 'YouTube', url: 'https://youtube.com/@mfsquoted?si=Wm3FrgRr2x1Uqjbb', bg: '#ff0000', g: '<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9l5 3-5 3z"/>' },
            { name: 'Facebook', url: 'https://www.facebook.com/share/1FPhXANVyZ/', bg: '#1877f2', g: '<path d="M14 21v-8h2.6l.4-3h-3V8.2c0-.9.3-1.5 1.6-1.5H17V4.1A20 20 0 0 0 14.8 4C12.6 4 11 5.4 11 7.8V10H8.5v3H11v8"/>' },
            { name: 'TikTok', url: 'https://www.tiktok.com/@xcab521', bg: '#111111', g: '<path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 4c.4 2.4 2 4 4.5 4.2"/>' }
        ];
        const SVG = (p) => '<svg viewBox="0 0 24 24">' + p + '</svg>';
        (function buildBar() {
            const rows = [];
            if (CONTACT_EMAIL) rows.push(`<a class="row" href="mailto:${esc(CONTACT_EMAIL)}">${SVG('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>')} ${esc(CONTACT_EMAIL)}</a>`);
            if (safeUrl(CONTACT_WHATSAPP_LINK) !== '#') rows.push(`<a class="row" href="${esc(safeUrl(CONTACT_WHATSAPP_LINK))}" target="_blank" rel="noopener noreferrer">${SVG('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>')} WhatsApp</a>`);
            document.getElementById('contact-rows').innerHTML = rows.join('') || '<p class="empty" style="padding:0">Use the Ask box.</p>';
            const soc = SOCIALS.filter(x => safeUrl(x.url) !== '#');
            document.getElementById('soc-links').innerHTML = soc.length
                ? soc.map(x => `<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer" aria-label="${esc(x.name)}" style="background:${x.bg}">${SVG(x.g)}${esc(x.name)}</a>`).join('')
                : '<p class="empty" style="padding:0">Coming soon.</p>';
        })();
        function closeSheets() {
            document.querySelectorAll('.sheet').forEach(x => x.classList.remove('open'));
            document.querySelectorAll('.bi').forEach(x => x.classList.remove('on'));
        }
        function syncBar() {
            document.body.classList.toggle('on-all', chip === 'all' && !searchInput.value.trim());
            closeSheets();
        }
        document.querySelectorAll('.bi').forEach(b => b.addEventListener('click', () => {
            const sh = document.getElementById('sheet-' + b.dataset.sheet);
            const was = sh.classList.contains('open');
            closeSheets();
            if (!was) { sh.classList.add('open'); b.classList.add('on'); }
        }));
        document.addEventListener('click', (e) => { if (!e.target.closest('.foot')) closeSheets(); });
        const ASK_ERR = { links: 'Please remove links from your message.', busy: 'Too many questions right now. Try again in a few minutes.', bad_name: 'Please enter your name.', bad_body: 'Please write your question (2 to 1000 characters).', bad_contact: 'The contact detail is too long.' };
        document.getElementById('ask-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const msg = document.getElementById('ask-msg'), btn = document.getElementById('ask-send');
            if (document.getElementById('ask-hp').value) { msg.className = 'ok'; msg.textContent = 'Thank you! We got your question.'; return; }
            btn.disabled = true; msg.className = ''; msg.textContent = 'Sending...';
            try {
                const { data, error } = await supabaseClient.rpc('submit_question', {
                    p_name: document.getElementById('ask-name').value,
                    p_contact: document.getElementById('ask-contact').value,
                    p_body: document.getElementById('ask-body').value
                });
                if (error || !data) throw new Error('fail');
                if (data === 'ok') { msg.className = 'ok'; msg.textContent = 'Thank you! We got your question.'; document.getElementById('ask-body').value = ''; }
                else { msg.className = 'err'; msg.textContent = ASK_ERR[data] || 'Could not send. Please try again.'; }
            } catch (err) { msg.className = 'err'; msg.textContent = 'Could not send. Please try again.'; }
            btn.disabled = false;
        });
        load();
    </script>
</body>
</html>
